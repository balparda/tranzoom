name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:

      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Poetry
        run: pip install poetry

      - name: Install deps
        run: poetry install

      - name: Lint
        run: poetry run ruff check .

      - name: Format
        run: poetry run ruff format --check --diff .

      - name: Typecheck
        run: poetry run mypy src tests tests_integration

      - name: Tests w/ typeguard & Coverage
        run: poetry run pytest --typeguard-packages=tranzoom --cov=src --cov-report=term-missing -q tests

  integration:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    env:
      PIP_NO_CACHE_DIR: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'

    steps:

      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          # no pip cache in this job: keeps disk usage down

      - name: Install GMP/MPFR/MPC libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev

      - name: Install Poetry and build dependencies for wheel building
        run: pip install --no-cache-dir poetry

      - name: Build wheel
        run: poetry build -f wheel --clean

      - name: Install built wheel into test venv
        run: |
          python -m venv .venv-wheel-test
          .venv-wheel-test/bin/python -m pip install --upgrade pip
          .venv-wheel-test/bin/python -m pip install dist/*.whl

      - name: Run integration tests against installed wheel
        run: |
          .venv-wheel-test/bin/python -m pip install pytest
          .venv-wheel-test/bin/python -m pytest -vvvv tests_integration/test_installed_cli.py
